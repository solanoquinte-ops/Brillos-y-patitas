<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRILLOS Y PATITAS | Pet Shop</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #fff; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #eaeaea; background: #fff; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 24px; background: none; border: none; cursor: pointer; padding: 0; }
        .logo-text { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #111; text-decoration: none; }
        .contacto-header { background-color: #ff4d6d; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .dropdown-menu { display: none; position: absolute; top: 60px; left: 15px; background: white; width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 12px; padding: 10px 0; z-index: 200; border: 1px solid #eee; }
        .dropdown-menu a { display: block; padding: 12px 20px; color: #333; text-decoration: none; font-size: 15px; border-bottom: 1px solid #f9f9f9; }
        .dropdown-menu a:hover { background: #fdf0f3; color: #ff4d6d; }
        .dropdown-menu.show { display: block; }
        .contenido { text-align: center; padding: 40px 20px; }
        h2 { font-size: 22px; color: #222; margin-top: 25px; }
        p { font-size: 15px; color: #666; max-width: 500px; margin: 10px auto; line-height: 1.5; }
        .precio { font-size: 18px; font-weight: bold; color: #111; margin: 15px 0; }
        .btn-whatsapp { display: inline-block; background: #25d366; color: white; padding: 12px 24px; text-decoration: none; border-radius: 25px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <a href="#" class="logo-text">BRILLOS Y PATITAS</a>
        <a href="https://wa.me/51982692250?text=Hola%20Brillos%20y%20Patitas,%20quiero%20consultar" class="contacto-header" target="_blank">Contacto</a>
    </header>

    <div id="menuDesplegable" class="dropdown-menu">
        <a href="#">Inicio</a>
        <a href="#">Colección Hembras</a>
        <a href="#">Guía de Tallas</a>
        <a href="#">Ofertas</a>
        <a href="#">Nosotros</a>
    </div>

    <div class="contenido">
        <p style="font-style: italic; color: #ff4d6d; font-weight: bold; margin-bottom: 30px;">¡Brillo en cada huella!</p>

        <h2>Vestido Pink Blossom</h2>
        <p>Un vestido elegante de inspiración floral que combina textura, encaje y detalles delicados para ocasiones especiales.</p>
        
        <div class="precio">S/ 41.00 (Talla 1)</div>

        <a href="https://wa.me/51982692250?text=Hola%20Brillos%20y%20Patitas,%20quiero%20consultar%20por%20el%20Vestido%20Pink%20Blossom." class="btn-whatsapp" target="_blank">
            Consultar por WhatsApp 💬
        </a>
    </div>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("menuDesplegable");
            menu.classList.toggle("show");
        }
        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>

</body>
</html>
